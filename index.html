<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión y Registrarse</title>
  <link rel="stylesheet" href="estilos.css">
  <script src="codigo.js"></script>
</head>
<body>

  <div class="contenedor">

    <div class="seccion izquierda">
      
      <div class="caja_master">
        <div class="hijo1">
          <img src="imagenes/logo.jpg" alt="Logo" class="logo-img" onerror="this.style.display='none'">
        </div>
        <div class="hijo2">
          <nav aria-label="breadcrumb">
            <ol class="menu-navegacion">
              <li class="item-navegacion"><a href="#">Iniciar sesión</a></li>
              <li class="item-navegacion activo" aria-current="page">Registrarse</li>
            </ol>
          </nav>
        </div>
      </div>

      <div class="bloque-login">
        <div class="encabezado-seccion">
          <h2>Iniciar sesión</h2>
          <p>Ingresa a tu cuenta de Instagriddy para continuar.</p>
        </div>

        <form class="formulario" onsubmit="event.preventDefault(); inicio();">
          <div class="mb-3">
            <label for="exampleInputEmail1" class="form-label">Correo electrónico / Nombre de usuario</label>
            <input type="email" class="form-control" id="exampleInputEmail1" placeholder="Tu correo o usuario" required>
            <div id="emailHelp" class="form-text">Nunca compartiremos tu correo electrónico con nadie más.</div>
          </div>

          <div class="mb-3">
            <label for="exampleInputPassword1" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="exampleInputPassword1" placeholder="Tu contraseña" required>
          </div>

          <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="exampleCheck1">
            <label class="form-check-label" for="exampleCheck1">No soy un robot</label>
          </div>

          <button type="submit" class="btn btn-login">Iniciar sesión</button>
          <p id="notificacion"></p>
        </form>
      </div>

    </div>

    <div class="seccion derecha">
      <div class="encabezado-seccion">
        <h2>Crear una cuenta</h2>
        <p>Regístrate para compartir momentos y conectar con amigos.</p>
      </div>

      <form class="formulario" onsubmit="event.preventDefault(); registrar();">
        <div class="mb-3">
          <label for="nombreRegistro" class="form-label">Nombre completo</label>
          <input type="text" class="form-control" id="nombreRegistro" placeholder="Tu nombre" required>
        </div>

        <div class="mb-3">
          <label for="emailRegistro" class="form-label">Correo electrónico</label>
          <input type="email" class="form-control" id="emailRegistro" placeholder="correo@ejemplo.com" required>
        </div>

        <div class="mb-3">
          <label for="userRegistro" class="form-label">Nombre de usuario</label>
          <input type="text" class="form-control" id="userRegistro" placeholder="usuario123" required>
        </div>

        <div class="mb-3">
          <label for="passRegistro" class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="passRegistro" placeholder="Crea una contraseña" required>
        </div>

        <button type="submit" class="btn btn-registro">Registrarse</button>
        <p id="notificacionRegistro"></p>
      </form>
    </div>

  </div>

</body>
</html>
